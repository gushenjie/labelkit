[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labelkit"
version = "0.1.0"
description = "LLM-powered YOLO labeling, review, and fix pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "openai>=1.30.0",
  "opencv-python-headless>=4.8.0",
  "pyyaml>=6.0",
  "flask>=3.0.0",
  "ultralytics>=8.2.0",
  "alembic>=1.13.0",
  "psutil>=5.9.0",
  "kaggle>=1.7.4",
]

[project.scripts]
labelkit = "labelkit.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["labelkit*"]

[tool.setuptools.package-data]
labelkit = ["webapp/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "model: real Ultralytics training smoke tests (opt-in with LABELKIT_RUN_MODEL_SMOKE=1)",
  "benchmark: local performance gate tests",
]
